<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>데이터 내보내기</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
        h1 { font-size: 20px; margin-bottom: 4px; }
        p.desc { color: #666; font-size: 14px; margin-top: 0; }
        label { display: block; font-weight: 600; margin: 24px 0 8px; }
        input[type=date] { font-size: 16px; padding: 6px 8px; }
        .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }
        button { font-size: 14px; padding: 10px; border: 1px solid #ccc; background: #fafafa; border-radius: 6px; cursor: pointer; }
        button:hover { background: #f0f0f0; }
        button.all { grid-column: 1 / -1; background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 600; }
        button.all:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<h1>분석용 데이터 내보내기</h1>
<p class="desc">선택한 날짜 00:00 이후 데이터를 CSV로 내려받습니다.</p>

<form method="get">
    <label for="date">기준 날짜 (이 날짜부터)</label>
    <input type="date" id="date" name="date" th:value="${today}" required>

    <div class="buttons">
        <button type="submit" class="all" th:formaction="@{/export/all}">전체 한 번에 (ZIP)</button>
        <button type="submit" th:each="t : ${tables}" th:formaction="@{/export/{t}(t=${t})}" th:text="${t}">table</button>
    </div>
</form>
</body>
</html>
